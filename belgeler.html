/* ---- Ortak yardımcılar ---- */
window.ORTAK = (function(){
  var A = window.AYAR;
  var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function pazartesi(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
  function haftaEtiket(k){
    var p = k.split("-"), a = new Date(+p[0], +p[1]-1, +p[2]), b = new Date(a); b.setDate(a.getDate()+6);
    return a.getMonth() === b.getMonth()
      ? a.getDate() + "–" + b.getDate() + " " + AYLAR[a.getMonth()] + " " + b.getFullYear()
      : a.getDate() + " " + AYLAR[a.getMonth()] + " – " + b.getDate() + " " + AYLAR[b.getMonth()] + " " + b.getFullYear();
  }
  /* ISO hafta (Eğitim sistemiyle aynı hesap) */
  function isoHafta(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return null;
    var t = new Date(Date.UTC(+m[1], +m[2]-1, +m[3])); var g = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - g);
    var y = t.getUTCFullYear(), ilk = new Date(Date.UTC(y,0,1));
    return { yil:y, hafta: Math.ceil(((t-ilk)/86400000+1)/7) };
  }
  function isoPazartesi(yil, hafta){
    var d = new Date(Date.UTC(yil, 0, 4)); var g = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() - g + 1 + (hafta-1)*7);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  function zamanDamgasi(d){
    return pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  function damgaCoz(s){
    var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s || "");
    return m ? new Date(+m[3], m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)) : null;
  }
  function denemeOku(){
    try { var v = JSON.parse(localStorage.getItem(A.DENEME_ANAHTAR) || "null"); if (v && v.teskilat && v.egitim) { v.stk = v.stk || []; return v; } } catch(e){}
    return { teskilat:[], egitim:[], stk:[] };
  }
  function denemeYaz(v){ try { localStorage.setItem(A.DENEME_ANAHTAR, JSON.stringify(v)); return true; } catch(e){ return false; } }
  function denemeTemizle(){ try { localStorage.removeItem(A.DENEME_ANAHTAR); } catch(e){} }
  function egitimCagir(islem, args){
    return fetch(A.EGITIM.API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ islem:islem, args:args || [] }) })
      .then(function(r){ return r.json(); })
      .then(function(c){ if (c && c.ok) return c.sonuc; throw new Error((c && c.hata) || "Bilinmeyen hata."); });
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  return { AYLAR:AYLAR, pad:pad, ymd:ymd, pazartesi:pazartesi, haftaEtiket:haftaEtiket, isoHafta:isoHafta, isoPazartesi:isoPazartesi,
           zamanDamgasi:zamanDamgasi, damgaCoz:damgaCoz, denemeOku:denemeOku, denemeYaz:denemeYaz, denemeTemizle:denemeTemizle,
           egitimCagir:egitimCagir, esc:esc };
})();

/* =========================================================
   Veri katmanı: rapor kayıtları, dönemler, resmî site, veri kontrolü
   ========================================================= */
window.VERI = (function(){
  var A = window.AYAR, O = window.ORTAK;

  /* ---- zaman aşımlı fetch ---- */
  function getir(url, secenek, sure){
    var kontrol = typeof AbortController !== "undefined" ? new AbortController() : null;
    var zaman = setTimeout(function(){ if (kontrol) kontrol.abort(); }, sure || 15000);
    var o = Object.assign({}, secenek || {}); if (kontrol) o.signal = kontrol.signal;
    return fetch(url, o).then(function(r){ clearTimeout(zaman); if (!r.ok) throw new Error("HTTP " + r.status); return r; },
      function(e){ clearTimeout(zaman); throw new Error(e && e.name === "AbortError" ? "zaman aşımı" : "bağlantı kurulamadı"); });
  }

  /* ---- resmî site API ---- */
  /* Parti Programı, Tüzük ve Saadet Çözer başlıkları sitemizdeki kopyadan (belgeler-veri.json) okunur;
     kopya okunamazsa saadet.org.tr'den canlı okunur. */
  var YEREL = { program_kategori:1, tuzuk_kategori:1, program:1, tuzuk:1, saadet_cozer_kategori:1 }, _belge = null;
  function belge(){
    if (!_belge) _belge = getir(A.BELGE_VERI + "?_=" + Math.floor(Date.now() / 3600000)).then(function(r){ return r.json(); });
    return _belge;
  }
  function site(kaynak, param){
    if (YEREL[kaynak] && A.BELGE_VERI) {
      return belge().then(function(b){
        var v = (kaynak === "program" || kaynak === "tuzuk") ? (b[kaynak] || {})[String((param || {}).kategori)] : b[kaynak];
        if (!Array.isArray(v) || !v.length) throw new Error("kopyada yok");
        return v;
      }).catch(function(){ return canli(kaynak, param); });
    }
    return canli(kaynak, param);
  }
  function canli(kaynak, param){
    var p = new URLSearchParams(); p.set("resource", kaynak);
    Object.keys(param || {}).forEach(function(k){ p.set(k, param[k]); });
    return getir(A.SITE_API + "?" + p.toString()).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.sonuc === 0) throw new Error(j.mesaj || "boş yanıt");
      return j;
    });
  }
  var _ta = null;
  function varlikCoz(s){ if (s == null) return ""; _ta = _ta || document.createElement("textarea"); _ta.innerHTML = String(s); return _ta.value; }
  /* Siteden gelen HTML'i güvenli hale getirir: yalnızca metin biçimi etiketleri kalır */
  function temizHtml(html){
    var IZIN = { P:1, BR:1, STRONG:1, B:1, EM:1, I:1, U:1, UL:1, OL:1, LI:1, H1:1, H2:1, H3:1, H4:1, H5:1, BLOCKQUOTE:1, TABLE:1, THEAD:1, TBODY:1, TR:1, TD:1, TH:1, A:1, SPAN:1, DIV:1, SUP:1, SUB:1 };
    var doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
    (function gez(el){
      Array.prototype.slice.call(el.childNodes).forEach(function(n){
        if (n.nodeType === 1){
          if (!IZIN[n.tagName]) { if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|FORM|INPUT|BUTTON|LINK|META)$/.test(n.tagName)) { n.remove(); return; } gez(n); while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n); n.remove(); return; }
          Array.prototype.slice.call(n.attributes).forEach(function(at){
            var ad = at.name.toLowerCase();
            if (n.tagName === "A" && ad === "href" && /^https?:/i.test(at.value)) return;
            n.removeAttribute(at.name);
          });
          if (n.tagName === "A") { n.setAttribute("target","_blank"); n.setAttribute("rel","noopener"); }
          gez(n);
        } else if (n.nodeType !== 3) n.remove();
      });
    })(doc.body.firstChild);
    return doc.body.firstChild.innerHTML;
  }
  function tarihUnix(t){ var d = new Date(+t * 1000); return isNaN(d) ? "" : d.toLocaleDateString("tr-TR", { day:"numeric", month:"long", year:"numeric" }); }
  function baslikHarf(s){ return String(s || "").trim().split(/\s+/).map(function(w){ return w ? w.charAt(0).toLocaleUpperCase("tr-TR") + w.slice(1).toLocaleLowerCase("tr-TR") : w; }).join(" "); }

  /* ---- rapor kayıtları (ilçe + hafta başına son gönderilen) ---- */
  var C = { ts:0, ilce:1, sor:2, top:3, iyk:4, yeni:6, mg:7, ara:8, temas:9, stant:10, resmi:11, teysis:12, aciklama:13, uye:14, mah:15, diger:16 };
  function teskilatKayitlari(rows){
    var den = O.denemeOku().teskilat.map(function(r){ return { r:r, deneme:true }; });
    var liste = [];
    (rows || []).map(function(r){ return { r:r, deneme:false }; }).concat(den).forEach(function(x){
      var r = x.r; if (!r || !r[C.ts]) return; var d = O.damgaCoz(r[C.ts]); if (!d) return;
      liste.push({ d:d, hafta:O.ymd(O.pazartesi(d)), ilce:String(r[C.ilce] || "").trim(), giren:baslikHarf(r[C.sor]), deneme:x.deneme, ileri: d.getTime() > Date.now() + 600000 });
    });
    liste.sort(function(a,b){ return a.d - b.d; });
    var son = {}; liste.forEach(function(k){ son[k.ilce + "|" + k.hafta] = k; });
    return Object.keys(son).map(function(x){ return son[x]; });
  }
  function egitimKayitlari(raporlar){
    var son = {};
    (raporlar || []).concat(O.denemeOku().egitim).forEach(function(r){
      var k = { ilce:r.ilce, giren:r.giren, hafta:O.ymd(O.isoPazartesi(+r.yil, +r.hafta)), deneme:!!r.deneme };
      son[k.ilce + "|" + k.hafta] = k;
    });
    return Object.keys(son).map(function(x){ return son[x]; });
  }

  /* ---- dönemler ---- */
  function stkKayitlari(kayitlar){
    var son = {};
    (kayitlar || []).concat(O.denemeOku().stk || []).forEach(function(r){
      var k = Object.assign({}, r, { giren:r.giren || "", deneme:!!r.deneme });
      son[k.ilce + "|" + k.hafta] = k;
    });
    return Object.keys(son).map(function(x){ return son[x]; });
  }
  function stkVeri(){ return getir(A.STK.API + "?api=veri&_=" + Date.now(), { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(j){ if (!j || !Array.isArray(j.kayitlar)) throw new Error((j && j.hata) || "beklenmeyen yanıt"); return j; }); }
  function stkAyar(){ return getir(A.STK.API + "?api=ayar").then(function(r){ return r.json(); }).then(function(j){ if (!j || !Array.isArray(j.gruplar)) throw new Error((j && j.hata) || "beklenmeyen yanıt"); return j; }); }
  function stkKaydet(v, uzerineYaz){
    return getir(A.STK.API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ islem:"kaydet", v:v, uzerineYaz:!!uzerineYaz }) }, 30000)
      .then(function(r){ return r.json(); }).then(function(j){ if (!j || j.hata) throw new Error((j && j.hata) || "Kayıt yapılamadı."); return j.sonuc; });
  }
  function haftaKaydir(k, n){ var p = k.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate() + 7*n); return O.ymd(d); }
  function buHafta(){ return O.ymd(O.pazartesi(new Date())); }
  function ayEtiket(k){ var p = k.split("-"); return O.AYLAR[+p[1]-1] + " " + p[0]; }
  /* bir dönemdeki haftalar (bu haftaya kadar, verilen başlangıçtan itibaren) */
  function donemHaftalari(mod, anahtar, baslangic){
    var bitis = buHafta(), l = [];
    if (!baslangic) return l;
    var h = baslangic;
    while (h <= bitis) {
      if (mod === "tum" || (mod === "hafta" && h === anahtar) || (mod === "ay" && h.slice(0,7) === anahtar)) l.push(h);
      h = haftaKaydir(h, 1);
    }
    return l;
  }

  /* ---- veri kontrolü kayıtları ---- */
  var KONTROL = {};
  function kontrol(anahtar, ad, durum, ayrinti){ KONTROL[anahtar] = { ad:ad, durum:durum, ayrinti:ayrinti || "", zaman:new Date() }; if (VERI.kontrolDegisti) VERI.kontrolDegisti(); }

  /* ---- sosyal medya simgeleri ---- */

    instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.9a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM20.9 8c-.1-1.5-.4-2.8-1.5-3.9S17 2.7 15.5 2.6C14 2.5 10 2.5 8.5 2.6 7 2.7 5.7 3 4.6 4.1S3.1 6.5 3.1 8C3 9.5 3 13.5 3.1 15c.1 1.5.4 2.8 1.5 3.9s2.4 1.4 3.9 1.5c1.5.1 5.5.1 7 0 1.5-.1 2.8-.4 3.9-1.5s1.4-2.4 1.5-3.9c.1-1.5.1-5.5 0-7zm-2 9.4a3 3 0 0 1-1.7 1.7c-1.2.5-4 .4-5.2.4s-4 .1-5.2-.4a3 3 0 0 1-1.7-1.7c-.5-1.2-.4-4-.4-5.4s-.1-4.2.4-5.4a3 3 0 0 1 1.7-1.7c1.2-.5 4-.4 5.2-.4s4-.1 5.2.4a3 3 0 0 1 1.7 1.7c.5 1.2.4 4 .4 5.4s.1 4.2-.4 5.4z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>',

  };
  var SOSYAL_AD = { facebook:"Facebook", x:"X", instagram:"Instagram", youtube:"YouTube", tiktok:"TikTok" };

  return { getir:getir, site:site, belge:belge, varlikCoz:varlikCoz, temizHtml:temizHtml, tarihUnix:tarihUnix, baslikHarf:baslikHarf,
           teskilatKayitlari:teskilatKayitlari, egitimKayitlari:egitimKayitlari, stkKayitlari:stkKayitlari, stkVeri:stkVeri, stkAyar:stkAyar, stkKaydet:stkKaydet,
           haftaKaydir:haftaKaydir, buHafta:buHafta, ayEtiket:ayEtiket, donemHaftalari:donemHaftalari,
           KONTROL:KONTROL, kontrol:kontrol, SIMGE:SIMGE, SOSYAL_AD:SOSYAL_AD };

/* ---------- Rapor görüntüleme şifresi (1. aşama: sayfa kilidi) ----------
   Şifrenin kendisi kodda tutulmaz; yalnızca SHA-256 özeti (AYAR.RAPOR_SIFRE_OZET) tutulur.
   Şifre değişince özet değişir ve daha önce şifre girilmiş tüm cihazlardan yeniden şifre istenir. */
window.YETKI = (function(){
  var ANAHTAR = "birimRaporlari_yetki";
  function ozet(metin){
    var veri = new TextEncoder().encode(metin);
    return crypto.subtle.digest("SHA-256", veri).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); });
  }
  function acik(){ try { return localStorage.getItem(ANAHTAR) === window.AYAR.RAPOR_SIFRE_OZET; } catch(e){ return false; } }
  function kilitle(){ try { localStorage.removeItem(ANAHTAR); } catch(e){} }
  function stil(){
    if (document.getElementById("yetkiStil")) return;
    var s = document.createElement("style"); s.id = "yetkiStil";
    s.textContent = ".yetki-arka{position:fixed;inset:0;background:rgba(29,27,25,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}" +
      ".yetki-kutu{background:#fff;border-radius:14px;max-width:360px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);font-family:inherit}" +
      ".yetki-kutu h3{margin:0 0 6px;font-size:18px;color:#1d1b19}.yetki-kutu p{margin:0 0 14px;color:#7d776f;font-size:14px;line-height:1.45}" +
      ".yetki-kutu input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9d4cd;border-radius:8px;font-size:16px}" +
      ".yetki-kutu .hata{color:#cd272d;font-size:13px;min-height:18px;margin:6px 0 4px}" +
      ".yetki-kutu .dugmeler{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}" +
      ".yetki-kutu button{border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}" +
      ".yetki-kutu .tamam{background:#cd272d;color:#fff}.yetki-kutu .iptal{background:#f1eee9;color:#1d1b19}";
    document.head.appendChild(s);
  }
  /* sec: { baslik, metin, iptalAdres } — iptalAdres verilirse "Vazgeç" o adrese götürür */
  function iste(sonra, sec){
    sec = sec || {};
    if (acik()) { sonra(); return; }
    stil();
    var arka = document.createElement("div"); arka.className = "yetki-arka";
    arka.innerHTML = '<form class="yetki-kutu" autocomplete="off"><h3>' + (sec.baslik || "Rapor verileri") + '</h3><p>' + (sec.metin || "Raporları görmek için il yönetimi şifresini girin.") + '</p>' +
      '<input type="password" aria-label="Şifre" placeholder="Şifre" autofocus><div class="hata" role="alert"></div>' +
      '<div class="dugmeler"><button type="button" class="iptal">Vazgeç</button><button type="submit" class="tamam">Giriş</button></div></form>';
    document.body.appendChild(arka);
    var f = arka.querySelector("form"), inp = arka.querySelector("input"), hata = arka.querySelector(".hata");
    setTimeout(function(){ inp.focus(); }, 30);
    arka.querySelector(".iptal").onclick = function(){ if (sec.iptalAdres) location.href = sec.iptalAdres; else arka.remove(); };
    f.onsubmit = function(ev){
      ev.preventDefault();
      ozet(inp.value).then(function(h){
        if (h !== window.AYAR.RAPOR_SIFRE_OZET) { hata.textContent = "Şifre hatalı."; inp.select(); return; }
        try { localStorage.setItem(ANAHTAR, h); } catch(e){}
        arka.remove(); sonra();
      });
    };
  }
  return { acik:acik, iste:iste, kilitle:kilitle, ozet:ozet };
})();

/* ---------- Ziyaretçi istatistikleri (isimsiz) ----------
   Kayıt: sayfa görüntüleme, bölüm görünme ve süreleri, tıklamalar, geliş kaynağı, cihaz türü.
   Kişi adı, IP ya da konum kaydedilmez. Ziyaretçi numarası rastgele üretilir ve yalnızca bu cihazda tutulur.
   Bir cihazda izlemeyi kapatmak için adresin sonuna ?izleme=kapat eklenir (açmak için ?izleme=ac). */
window.IZLEME = (function(){
  var A = window.AYAR || {}, URL_ = A.ZIYARET_API, ZK = "birimRaporlari_ziyaretci", OK = "birimRaporlari_oturum", KAPALI = "birimRaporlari_izlemeKapali";
  var SAYFA = { "": "Ana sayfa", "index.html": "Ana sayfa", "giris.html": "Rapor giriş paneli", "detay.html": "Ayrıntılı rapor", "belgeler.html": "Parti belgeleri" };
  var kuyruk = [], bolum = {}, sayfaSure = 0, gorunurBas = null, z, o, kaynak = "", cihaz = "";
  function rasgele(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
  function kaynakBul(){
    var p = new URLSearchParams(location.search), k = (p.get("k") || p.get("utm_source") || "").toLowerCase();
    var r = ""; try { r = document.referrer ? new URL(document.referrer).hostname.toLowerCase() : ""; } catch(e){}
    var s = k + " " + r;
    if (r && r === location.hostname && !k) return "";   // site içi geçiş: yeni kaynak değil
    if (/whatsapp|wa\.me/.test(s)) return "WhatsApp";
    if (/facebook|fb\.com|fb\b/.test(s)) return "Facebook";
    if (/instagram/.test(s)) return "Instagram";
    if (/t\.co\b|twitter|x\.com|\bx\b/.test(s)) return "X (Twitter)";
    if (/youtube|youtu\.be/.test(s)) return "YouTube";
    if (/tiktok/.test(s)) return "TikTok";
    if (/telegram|t\.me/.test(s)) return "Telegram";
    if (/google/.test(s)) return "Google";
    if (/bing|yandex|duckduckgo|yahoo/.test(s)) return "Diğer arama motoru";
    if (/saadet\.org\.tr/.test(s)) return "saadet.org.tr";
    if (k) return k.slice(0, 30);
    if (r) return "Diğer site";
    return "Doğrudan (adres / uygulama içi bağlantı)";
  }
  function cihazBul(){ var u = navigator.userAgent; return /iPad|Tablet|Android(?!.*Mobile)/i.test(u) ? "Tablet" : /Mobi|iPhone|Android/i.test(u) ? "Telefon" : "Bilgisayar"; }
  function oturum(){
    var simdi = Date.now(), v = {}; try { v = JSON.parse(ls(OK) || "{}"); } catch(e){}
    var kb = kaynakBul();
    if (!v.id || simdi - (v.son || 0) > 30 * 60 * 1000 || (kb && kb !== v.k && kb !== "Doğrudan (adres / uygulama içi bağlantı)")) {
      v = { id:rasgele(), k:kb || "Doğrudan (adres / uygulama içi bağlantı)", yeni:1 };
    }
    v.son = simdi; ls(OK, JSON.stringify({ id:v.id, k:v.k, son:v.son }));
    return v;
  }
  function ekle(t, ad, sure, yeni){ kuyruk.push({ t:t, a:ad || "", s:Math.round(sure || 0), y:yeni ? 1 : 0 }); }
  function gonder(){
    if (!kuyruk.length) return;
    var veri = JSON.stringify({ z:z, o:o.id, p:SAYFA[(location.pathname.split("/").pop() || "")] || location.pathname.split("/").pop(), k:o.k, yo:o.yeni ? 1 : 0, c:cihaz, e:kuyruk.splice(0, 80) });
    o.yeni = 0;
    try { if (navigator.sendBeacon && navigator.sendBeacon(URL_, new Blob([veri], { type:"text/plain;charset=utf-8" }))) return; } catch(e){}
    try { fetch(URL_, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:veri }); } catch(e){}
  }
  function sureyiTopla(){
    var simdi = Date.now();
    if (gorunurBas) { sayfaSure += (simdi - gorunurBas) / 1000; gorunurBas = simdi; }
    Object.keys(bolum).forEach(function(ad){ var b = bolum[ad]; if (b.bas) { b.sure += (simdi - b.bas) / 1000; b.bas = simdi; } });
  }
  function bosalt(){
    sureyiTopla();
    if (sayfaSure >= 1) ekle("sure", "", sayfaSure); sayfaSure = 0;
    Object.keys(bolum).forEach(function(ad){ var b = bolum[ad]; if (b.sure >= 1 || b.yeni) ekle("bolum", ad, b.sure, b.yeni); b.sure = 0; b.yeni = false; });
    gonder();
  }
  function tikAdi(a){
    var h = a.getAttribute("href") || "", ic = function(s){ return a.closest(s); };
    if (a.id === "uyeOl") return "Üye Ol";
    if (a.classList.contains("karo")) return "Rapor panosu";
    if (a.classList.contains("ahlak")) return "Ahlak Manifestosu";
    if (ic("#haberler") || a.id === "haberlerTum") return "Haber (Gündem)";
    if (ic("#bulten")) return "Basın bülteni haberi";
    if (ic("#arsiv") || a.id === "arsivTum") return "Dosya arşivi";
    if (ic("#cozer") || a.id === "cozerTum") return "Saadet Çözer";
    if (ic(".belge-kartlar") || /belgeler\.html/.test(h)) return "Parti belgeleri";
    if (/\.pdf(\?|$)/i.test(h)) return "PDF";
    if (/facebook\.com/i.test(h)) return "Sosyal medya · Facebook";
    if (/instagram\.com/i.test(h)) return "Sosyal medya · Instagram";
    if (/(x|twitter)\.com/i.test(h)) return "Sosyal medya · X";
    if (/youtube\.com|youtu\.be/i.test(h)) return "Sosyal medya · YouTube";
    if (/tiktok\.com/i.test(h)) return "Sosyal medya · TikTok";
    if (/^tel:/i.test(h)) return "Telefon arama";
    if (/^mailto:/i.test(h)) return "E-posta";
    if (/google\.[^/]+\/maps|maps\.google|goo\.gl\/maps/i.test(h)) return "Harita / yol tarifi";
    if (/giris\.html/.test(h)) return "Rapor gir";
    if (/detay\.html/.test(h)) return "Ayrıntılı rapor";
    if (/^https?:/i.test(h) && a.hostname !== location.hostname) return "Diğer dış bağlantı";
    return "";
  }
  function baslat(){
    if (!URL_ || navigator.webdriver) return;
    var p = new URLSearchParams(location.search).get("izleme");
    if (p === "kapat") ls(KAPALI, "1"); else if (p === "ac") ls(KAPALI, null);
    if (ls(KAPALI) === "1") return;
    z = ls(ZK); if (!z) { z = rasgele(); ls(ZK, z); }
    o = oturum(); cihaz = cihazBul();
    ekle("sayfa", "", 0, o.yeni);
    gorunurBas = document.visibilityState === "visible" ? Date.now() : null;
    gonder();
    if ("IntersectionObserver" in window) {
      var gozcu = new IntersectionObserver(function(l){
        l.forEach(function(g){
          var ad = g.target.getAttribute("data-bolum"), b = bolum[ad] || (bolum[ad] = { sure:0, bas:null, yeni:false, goruldu:false });
          if (g.isIntersecting && document.visibilityState === "visible") { if (!b.goruldu) { b.goruldu = true; b.yeni = true; } if (!b.bas) b.bas = Date.now(); }
          else if (b.bas) { b.sure += (Date.now() - b.bas) / 1000; b.bas = null; }
        });
      }, { threshold:0.4 });
      document.querySelectorAll("[data-bolum]").forEach(function(el){ gozcu.observe(el); });
    }
    document.addEventListener("click", function(ev){
      var a = ev.target.closest && ev.target.closest("a[href]"); if (!a) return;
      var ad = tikAdi(a); if (ad) { ekle("tik", ad); if (a.target === "_blank" || a.hostname !== location.hostname || /^(tel|mailto):/i.test(a.getAttribute("href") || "")) bosalt(); }
    }, true);
    document.addEventListener("submit", function(ev){ if (ev.target && ev.target.id === "bizeYazin") ekle("tik", "Bize Yazın formu gönderildi"); }, true);
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "hidden") {
        bosalt(); gorunurBas = null;
        Object.keys(bolum).forEach(function(ad){ bolum[ad].bas = null; });
      } else {
        gorunurBas = Date.now();
        try { var v = JSON.parse(ls(OK) || "{}"); v.son = Date.now(); ls(OK, JSON.stringify(v)); } catch(e){}
      }
    });
    window.addEventListener("pagehide", bosalt);
    setInterval(function(){ if (document.visibilityState === "visible") { sureyiTopla(); try { var v = JSON.parse(ls(OK) || "{}"); v.son = Date.now(); ls(OK, JSON.stringify(v)); } catch(e){} } }, 30000);
  }
  function getirOzet(gun){ return fetch(URL_ + "?islem=ozet&gun=" + (gun || 30) + "&_=" + Date.now()).then(function(r){ return r.json(); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", baslat); else baslat();
  return { ozet:getirOzet, gonder:bosalt };
})();

  .metin .govde td,.metin .govde th{border:1px solid var(--cizgi);padding:6px}
  .cozer{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .cozer a{display:block;background:var(--kart);border:1px solid var(--cizgi);border-left:4px solid var(--kirmizi);border-radius:10px;padding:13px 14px;text-decoration:none;color:inherit;font-weight:700}
  .cozer a:hover{border-color:var(--kirmizi)}
  .cozer small{display:block;font-weight:400;color:var(--soluk);font-size:12.5px}
  .yukleniyor,.bos-mesaj{color:var(--soluk)}
  footer{color:var(--soluk);font-size:12.5px;text-align:center;padding:30px 16px}
</style>
</head>

<main class="sar">
  <nav class="sekmeler" aria-label="Belgeler">
    <a href="#program" data-s="program">Parti Programı</a>
    <a href="#tuzuk" data-s="tuzuk">Parti Tüzüğü</a>
    <a href="#cozer" data-s="cozer">Saadet Çözer</a>
  </nav>
  <div id="alan"></div>
</main>
<footer id="kredi"></footer>
<script>
(function(){
  var A = window.AYAR, O = window.ORTAK, V = window.VERI, esc = O.esc;
  var $ = function(id){ return document.getElementById(id); };
  $("kredi").textContent = A.KREDI.replace("Bu pano", "Bu sayfa");
  var DURUM = { s:null, kat:{}, secili:{} };

  function hata(kutu, e, link){ kutu.innerHTML = '<p class="bos-mesaj">İçerik şu an alınamadı (' + esc(e.message) + '). <a href="' + esc(link) + '" target="_blank" rel="noopener">saadet.org.tr\'de açın ↗</a></p>'; }

  function bolumlu(tur){
    var ayar = tur === "program"
      ? { katKaynak:"program_kategori", icKaynak:"program", baslik:"Parti Programı", link:A.BAGLANTI.program }
      : { katKaynak:"tuzuk_kategori", icKaynak:"tuzuk", baslik:"Parti Tüzüğü", link:A.BAGLANTI.tuzuk };
    var alan = $("alan");
    alan.innerHTML = '<div class="duzen"><div class="liste" id="liste"><div class="yukleniyor">Yükleniyor…</div></div><article class="metin" id="metin"><div class="yukleniyor">Yükleniyor…</div></article></div>';
    var katYukle = DURUM.kat[tur] ? Promise.resolve(DURUM.kat[tur]) : V.site(ayar.katKaynak, { lang:1 }).then(function(l){ DURUM.kat[tur] = l; return l; });
    katYukle.then(function(l){
      if (!DURUM.secili[tur]) DURUM.secili[tur] = l[0].id;
      var ad = function(x){ var t = V.varlikCoz(x.baslik); return tur === "tuzuk" ? V.baslikHarf(t) : t; };
      $("liste").innerHTML = l.map(function(x, i){ return '<button type="button" data-id="' + esc(x.id) + '" aria-current="' + (x.id === DURUM.secili[tur]) + '">' + (i + 1) + '. ' + esc(ad(x)) + '</button>'; }).join("");
      $("liste").querySelectorAll("button").forEach(function(b){ b.onclick = function(){ DURUM.secili[tur] = b.dataset.id; bolumlu(tur); window.scrollTo({ top:0 }); }; });
      var kat = l.filter(function(x){ return x.id === DURUM.secili[tur]; })[0];
      return V.site(ayar.icKaynak, { kategori:DURUM.secili[tur] }).then(function(ic){
        var h = '<h2>' + esc(ad(kat)) + '</h2><div class="kaynak">' + ayar.baslik + ' · kaynak: <a href="' + esc(ayar.link) + '" target="_blank" rel="noopener">saadet.org.tr ↗</a></div>';
        (Array.isArray(ic) ? ic : []).forEach(function(x){
          var govde = V.varlikCoz(x.detay || "");
          if (/&lt;|&gt;/.test(govde)) govde = V.varlikCoz(govde); /* tüzük metni iki kez kodlanmış */
          if (tur === "program" || (ic.length > 1)) h += '<h3>' + esc(V.varlikCoz(x.baslik)) + '</h3>';
          h += '<div class="govde">' + V.temizHtml(govde) + '</div>';
        });
        if (!ic || !ic.length) h += '<p class="bos-mesaj">Bu bölümde metin bulunamadı.</p>';
        $("metin").innerHTML = h;
      });
    }).catch(function(e){ hata(alan, e, ayar.link); });
  }

  function cozer(){
    var alan = $("alan");
    alan.innerHTML = '<div class="yukleniyor">Yükleniyor…</div>';
    V.site("saadet_cozer_kategori", { lang:1, include_slug:1 }).then(function(l){
      alan.innerHTML = '<div class="cozer">' + l.map(function(x, i){ return '<a href="' + esc(A.SITE + "/" + x.kod) + '" target="_blank" rel="noopener"><small>Başlık ' + (i + 1) + '</small>' + esc(V.varlikCoz(x.baslik)) + '</a>'; }).join("") + '</div>';
    }).catch(function(e){ hata(alan, e, A.BAGLANTI.cozer); });
  }

  function git(){
    var s = (location.hash || "#program").slice(1); if (["program","tuzuk","cozer"].indexOf(s) < 0) s = "program";
    document.querySelectorAll(".sekmeler a").forEach(function(a){ if (a.dataset.s === s) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (s === "cozer") cozer(); else bolumlu(s);
  }
  window.addEventListener("hashchange", git);
  git();
})();
</script>
